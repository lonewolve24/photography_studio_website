<div id="cookieConsentBanner" class="cookie-consent-banner" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden>
    <div class="cookie-consent-inner container">
        <div class="cookie-consent-text">
            <p class="mb-0">
                We use essential cookies to keep this site working and to remember your cookie preferences.
                See our <a href="{% url 'cookie_policy' %}">Cookie Policy</a> and
                <a href="{% url 'privacy_policy' %}">Privacy Policy</a> for details.
            </p>
        </div>
        <div class="cookie-consent-actions">
            <button type="button" class="btn btn-outline-light btn-sm cookie-consent-decline">Essential Only</button>
            <button type="button" class="btn btn-primary btn-sm cookie-consent-accept">Accept</button>
        </div>
    </div>
</div>
